<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Label Template – 6.5x11 on 8.5x11</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #e8e8e8;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }

    .controls {
      background: white;
      border-radius: 8px;
      padding: 20px 24px;
      max-width: 8.5in;
      margin: 0 auto 16px auto;
      box-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }

    .controls h3 {
      margin: 0 0 14px 0;
      font-size: 14px;
      color: #222;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 14px;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .field input[type="text"],
    .field input[type="date"],
    .field input[type="number"],
    .field select {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      height: 32px;
      box-sizing: border-box;
    }

    .field input[type="text"] { width: 180px; }
    .field input[type="date"] { width: 160px; }
    .field input[type="number"] { width: 80px; }
    .field select { width: 160px; }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-bottom: 6px;
    }

    .checkbox-field input[type="checkbox"] {
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .checkbox-field span {
      font-size: 12px;
      color: #444;
    }

    .divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0 14px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    button.generate {
      padding: 8px 20px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    button.generate:hover { background: #1558b0; }

    button.print-btn {
      padding: 8px 20px;
      background: #188038;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    button.print-btn:hover { background: #0f5c28; }

    .note {
      font-size: 11px;
      color: #888;
      max-width: 8.5in;
      margin: 0 auto 12px auto;
      text-align: center;
    }

    .sheet-gap {
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 8.5in;
      margin: 0 auto;
    }
    .sheet-gap span {
      font-size: 11px;
      color: #999;
      background: #e8e8e8;
      padding: 2px 10px;
    }

    .page {
      width: 8.5in;
      height: 11in;
      margin: 0 auto;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .page .guide {
      position: absolute;
      width: 6.5in;
      height: 11in;
      border: 1px dashed #d0d0d0;
      pointer-events: none;
      box-sizing: border-box;
    }

    .label-grid {
      width: 6.5in;
      height: 11in;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(10, 1fr);
      gap: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    .label {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      text-align: center;
      line-height: 1.35;
    }

    .label .name { color: #111; }
    .label .date { color: #333; margin-top: 3px; }
    .label .empty { font-size: 10px; color: #ccc; }

    @media print {
      body { margin: 0; padding: 0; background: white; }
      .controls, .note, .sheet-gap { display: none; }

      @page {
        size: 8.5in 11in;
        margin: 0;
      }

      .page {
        width: 8.5in;
        height: 11in;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
      }
      .page:last-child { page-break-after: avoid; }
      .page .guide { display: none; }
      .label { border: none; }
      .label .empty { display: none; }
    }
  </style>
</head>
<body>

  <div class="controls">
    <h3>Label Settings</h3>

    <div class="section-label">Content</div>
    <div class="row">
      <div class="field">
        <label>Person's Name</label>
        <input type="text" id="personName" placeholder="e.g. John Smith" />
      </div>
      <div class="field">
        <label>Start Date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="field">
        <label>Repeat per Date</label>
        <input type="number" id="repeatCount" value="5" min="1" max="20" />
      </div>
      <div class="field" style="justify-content:flex-end;gap:8px;">
        <div class="checkbox-field">
          <input type="checkbox" id="includeWeekends" />
          <span>Include weekends</span>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="allCapsName" />
          <span>All caps name</span>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <div class="section-label">Typography</div>
    <div class="row">
      <div class="field">
        <label>Font</label>
        <select id="fontFamily">
          <option value="Arial, sans-serif">Arial</option>
          <option value="'Helvetica Neue', Helvetica, sans-serif">Helvetica</option>
          <option value="Georgia, serif">Georgia</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
          <option value="Verdana, sans-serif">Verdana</option>
          <option value="Tahoma, sans-serif">Tahoma</option>
          <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
        </select>
      </div>
      <div class="field">
        <label>Name Size (pt)</label>
        <input type="number" id="nameSize" value="13" min="6" max="36" />
      </div>
      <div class="field">
        <label>Date Size (pt)</label>
        <input type="number" id="dateSize" value="11" min="6" max="36" />
      </div>
      <div class="field" style="gap:8px;">
        <div class="checkbox-field">
          <input type="checkbox" id="nameBold" checked />
          <span>Bold name</span>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="dateBold" />
          <span>Bold date</span>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <div class="section-label">Output</div>
    <div class="row">
      <div class="field">
        <label>Number of Sheets</label>
        <input type="number" id="numSheets" value="1" min="1" max="20" />
      </div>
      <div class="btn-row">
        <button class="generate" onclick="generateLabels()">Generate Labels</button>
        <button class="print-btn" onclick="window.print()">🖨 Print</button>
      </div>
    </div>
  </div>

  <div class="note" id="summaryNote">
    Labels print centered on 8.5×11 — feed printer a 6.5×11 sheet. Dashed outline shows label area (screen only).
  </div>

  <div id="sheetsContainer"></div>

  <script>
    function nextDay(date, includeWeekends) {
      const d = new Date(date);
      d.setDate(d.getDate() + 1);
      if (!includeWeekends) {
        while (d.getDay() === 0 || d.getDay() === 6) {
          d.setDate(d.getDate() + 1);
        }
      }
      return d;
    }

    function isWeekend(date) {
      return date.getDay() === 0 || date.getDay() === 6;
    }

    function formatDate(date) {
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      const yy = String(date.getFullYear()).slice(-2);
      return `${mm}/${dd}/${yy}`;
    }

    function escapeHTML(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function generateLabels() {
      const rawName     = document.getElementById('personName').value.trim();
      const rawDate     = document.getElementById('startDate').value;
      const repeat      = parseInt(document.getElementById('repeatCount').value) || 5;
      const incWeekends = document.getElementById('includeWeekends').checked;
      const allCaps     = document.getElementById('allCapsName').checked;
      const numSheets   = parseInt(document.getElementById('numSheets').value) || 1;
      const fontFamily  = document.getElementById('fontFamily').value;
      const nameSize    = document.getElementById('nameSize').value;
      const dateSize    = document.getElementById('dateSize').value;
      const nameBold    = document.getElementById('nameBold').checked;
      const dateBold    = document.getElementById('dateBold').checked;

      if (!rawName || !rawDate) {
        alert('Please enter both a name and a start date.');
        return;
      }

      const name = allCaps ? rawName.toUpperCase() : rawName;

      const [yr, mo, dy] = rawDate.split('-').map(Number);
      let currentDate = new Date(yr, mo - 1, dy);

      if (!incWeekends) {
        while (isWeekend(currentDate)) {
          currentDate.setDate(currentDate.getDate() + 1);
        }
      }

      const labelsPerSheet = 20;
      const totalLabels    = labelsPerSheet * numSheets;
      const container      = document.getElementById('sheetsContainer');
      container.innerHTML  = '';

      const dates = [];
      let countOnDate = 0;
      for (let i = 0; i < totalLabels; i++) {
        dates.push(new Date(currentDate));
        countOnDate++;
        if (countOnDate >= repeat) {
          currentDate = nextDay(currentDate, incWeekends);
          countOnDate = 0;
        }
      }

      for (let s = 0; s < numSheets; s++) {
        if (s > 0) {
          const gap = document.createElement('div');
          gap.className = 'sheet-gap';
          gap.innerHTML = `<span>— Sheet ${s + 1} —</span>`;
          container.appendChild(gap);
        }

        const page = document.createElement('div');
        page.className = 'page';

        const guide = document.createElement('div');
        guide.className = 'guide';
        page.appendChild(guide);

        const grid = document.createElement('div');
        grid.className = 'label-grid';

        for (let i = 0; i < labelsPerSheet; i++) {
          const d = dates[s * labelsPerSheet + i];
          const div = document.createElement('div');
          div.className = 'label';
          div.innerHTML = `
            <div class="name" style="font-family:${fontFamily};font-size:${nameSize}pt;font-weight:${nameBold ? '700' : '400'};">${escapeHTML(name)}</div>
            <div class="date" style="font-family:${fontFamily};font-size:${dateSize}pt;font-weight:${dateBold ? '700' : '400'};">${formatDate(d)}</div>
          `;
          grid.appendChild(div);
        }

        page.appendChild(grid);
        container.appendChild(page);
      }

      document.getElementById('summaryNote').textContent =
        `${numSheets} sheet${numSheets > 1 ? 's' : ''} · ${totalLabels} labels · ${repeat} per date · ${formatDate(dates[0])} → ${formatDate(dates[totalLabels - 1])}${incWeekends ? ' (weekends included)' : ' (weekdays only)'} · Print on 8.5×11, feed 6.5×11 sheet`;
    }

    (function initEmpty() {
      const container = document.getElementById('sheetsContainer');
      const page = document.createElement('div');
      page.className = 'page';
      const guide = document.createElement('div');
      guide.className = 'guide';
      page.appendChild(guide);
      const grid = document.createElement('div');
      grid.className = 'label-grid';
      for (let i = 0; i < 20; i++) {
        const div = document.createElement('div');
        div.className = 'label';
        div.innerHTML = `<div class="empty">Label ${i + 1}</div>`;
        grid.appendChild(div);
      }
      page.appendChild(grid);
      container.appendChild(page);
    })();
  </script>

</body>
</html>
